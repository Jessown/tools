<title>쓱툴 · 설치 없이 쓱 쓰는 무료 도구함</title>
<meta name="description" content="필요할 때 쓱 열고, 쓱 끝내는 무료 도구함. 가입·설치 없이 모자이크·가리기, 사진 대지, 칠판, 실시간 투표, 다국어 공지까지.">
<meta property="og:title" content="쓱툴 · 설치 없이 쓱 쓰는 무료 도구함"><meta property="og:description" content="필요할 때 쓱 열고, 쓱 끝내는 무료 도구함."><meta property="og:url" content="https://sseuktool.com/"><meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23111%22/%3E%3Ctext x=%2229%22 y=%2246%22 font-size=%2238%22 font-weight=%22900%22 text-anchor=%22middle%22 fill=%22%23fff%22 font-family=%22sans-serif%22%3E%EC%93%B1%3C/text%3E%3Ccircle cx=%2253%22 cy=%2245%22 r=%225%22 fill=%22%230047ff%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="assets/config.js"></script>
<style>
:root{--paper:#fff;--ink:#111;--soft:#666;--rule:#e4e4e4;--mark:#0047ff;--hover:#f5f5f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#111;--ink:#f2f2f2;--soft:#9a9a9a;--rule:#2c2c2c;--mark:#6b8cff;--hover:#1b1b1b}}
:root[data-theme="dark"]{--paper:#111;--ink:#f2f2f2;--soft:#9a9a9a;--rule:#2c2c2c;--mark:#6b8cff;--hover:#1b1b1b}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
.w{max-width:760px;margin:0 auto;padding:0 20px}
a{color:inherit}
header{padding:64px 0 4px}
.logo{display:inline-block;font-size:52px;font-weight:900;letter-spacing:-3px;line-height:1;text-decoration:none}
.logo i{font-style:normal;color:var(--mark)}
.intro{margin:22px 0 0;font-size:18px;font-weight:500;max-width:540px;word-break:keep-all;letter-spacing:-.3px}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;margin:16px 0 0;padding:0;list-style:none;font-size:14px;color:var(--soft)}
.facts li:before{content:"— ";color:var(--ink)}
section{margin-top:48px}
h2{font-size:13px;font-weight:800;margin:0;padding-bottom:10px;border-bottom:2px solid var(--ink);letter-spacing:.3px}
ol{list-style:none;margin:0;padding:0}
li a{display:grid;grid-template-columns:30px 1fr auto;gap:2px 14px;align-items:baseline;padding:15px 4px;border-bottom:1px solid var(--rule);text-decoration:none}
li a:hover{background:var(--hover)}
li a:focus-visible{outline:2px solid var(--mark);outline-offset:-2px}
.n{font-variant-numeric:tabular-nums;color:var(--soft);font-size:13px;font-weight:600}
.t{font-weight:800;font-size:18px;letter-spacing:-.4px}
.d{grid-column:2/3;color:var(--soft);font-size:14px;word-break:keep-all}
.go{grid-row:1/3;grid-column:3;align-self:center;font-size:20px;font-weight:700;transition:transform .15s}
li a:hover .go{transform:translateX(4px);color:var(--mark)}
.new{font-size:10.5px;font-weight:800;color:var(--mark);margin-left:8px;vertical-align:3px;letter-spacing:.5px}
.wish{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;margin-top:56px;padding:20px 4px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);text-decoration:none}
.wish b{font-size:18px;font-weight:800;letter-spacing:-.4px}.wish span{color:var(--soft);font-size:14.5px}.wish:hover span{color:var(--mark)}
footer{margin:40px 0 44px;font-size:13px;color:var(--soft);display:flex;flex-wrap:wrap;gap:6px 18px}
@media (max-width:520px){header{padding-top:44px}.logo{font-size:44px}.go{display:none}li a{grid-template-columns:26px 1fr}}
</style></head><body>
<div class="w">
<header>
  <a class="logo" href="./"><span id="nm">쓱툴</span><i>.</i></a>
  <p class="intro">필요할 때 쓱 열고, 쓱 끝내는 도구.</p>
  <ul class="facts"><li>설치·가입 없이 무료</li><li>사진은 내 기기 안에서만 처리</li><li>참여자는 QR만 찍으면 끝</li></ul>
</header>
<main id="list"></main>
<a class="wish" href="wish.html"><b>이런 도구 있으면 좋겠어요</b><span>필요한 도구를 한 줄로 적어 주세요 →</span></a>
<footer><span id="cp"></span><a href="privacy.html">개인정보 안내</a></footer>
</div>
<script>
var G = [
  ['사진 · 개인정보', [
    ['mosaic', '모자이크·가리기', '사진 속 얼굴, 신청서·명단의 연락처를 가리기 (PDF도 됨)'],
    ['bgrm', '배경 지우기', '사람이나 물건만 남기고 배경 없애기'],
    ['resize', '사진 용량 줄이기', '메일·업로드 용량 제한에 맞추기'],
    ['px', '사진 크기 맞추기', '가로·세로 픽셀을 여러 장 한 번에']]],
  ['문서 · 보고', [
    ['sheet', '사진 대지', '활동사진을 보고서용 A4 대지로, 설명까지', 1],
    ['scan', '문서 펴기', '비스듬히 찍은 서류를 스캔한 것처럼'],
    ['qr', 'QR 만들기', '링크를 QR 그림으로']]],
  ['진행 · 참여', [
    ['chalk', '칠판', '판서·안내문 띄우기, 휴대폰으로 함께 보기'],
    ['vote', '실시간 투표', '만족도·의견을 QR로 받아 바로 그래프로', 1],
    ['notice', '다국어 공지', '한국어로 쓰면 참여자 언어로 번역되어 보임', 1],
    ['timer', '타이머', '활동·쉬는 시간을 큰 화면으로']]],
  ['뽑기 · 놀이', [
    ['wheel', '돌림판', '이름이나 항목을 넣고 돌리기'],
    ['ladder', '사다리타기', '역할·순서 정하기'],
    ['lotto', '공 추첨', '경품별 개수를 정해 뽑기']]]
];
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
var k = 0;
document.getElementById('list').innerHTML = G.map(function (g) {
  return '<section><h2>' + esc(g[0]) + '</h2><ol>' + g[1].map(function (t) {
    k++;
    return '<li><a href="tools.html?m=' + t[0] + '"><span class="n">' + (k < 10 ? '0' + k : k) + '</span><span class="t">' + esc(t[1]) + (t[3] ? '<span class="new">NEW</span>' : '') + '</span><span class="go">→</span><span class="d">' + esc(t[2]) + '</span></a></li>';
  }).join('') + '</ol></section>';
}).join('');
var N = window.SITE_NAME || '쓱툴';
document.getElementById('nm').textContent = N; 
document.getElementById('cp').textContent = '© ' + new Date().getFullYear() + ' ' + N;
</script>
</body></html>
