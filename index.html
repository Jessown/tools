<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>쓱툴</title>
<meta name="description" content="일하다 필요할 때마다 하나씩 만든 도구 모음. 사진 가리기, 칠판, 투표, 다국어 공지, 사진 대지.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<script src="assets/config.js"></script>
<style>
:root{--paper:#f7f4ee;--ink:#1f1e1c;--soft:#6b665e;--rule:#d9d3c7;--mark:#d4502a;--hover:#efe9de}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#191816;--ink:#ece8e1;--soft:#9c968c;--rule:#36332f;--mark:#f0805c;--hover:#24221f}}
:root[data-theme="dark"]{--paper:#191816;--ink:#ece8e1;--soft:#9c968c;--rule:#36332f;--mark:#f0805c;--hover:#24221f}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
.w{max-width:760px;margin:0 auto;padding:0 20px}
a{color:inherit}
header{padding:56px 0 8px}
.logo{display:inline-block;font-size:44px;font-weight:800;letter-spacing:-2px;line-height:1;position:relative;text-decoration:none}
.logo svg{position:absolute;left:-4px;right:-6px;bottom:-10px;width:calc(100% + 10px);height:14px;color:var(--mark)}
.intro{margin:26px 0 0;font-size:17px;max-width:560px;word-break:keep-all}
.intro b{font-weight:700}
.note{font-family:"Nanum Pen Script",cursive;font-size:22px;color:var(--mark);transform:rotate(-2deg);display:inline-block;margin-top:10px}
section{margin-top:44px}
h2{font-size:13px;font-weight:700;color:var(--soft);margin:0 0 6px;padding-bottom:8px;border-bottom:2px solid var(--ink);letter-spacing:.5px}
ol{list-style:none;margin:0;padding:0}
li a{display:grid;grid-template-columns:28px 1fr auto;gap:4px 12px;align-items:baseline;padding:13px 6px;border-bottom:1px solid var(--rule);text-decoration:none}
li a:hover{background:var(--hover)}
li a:focus-visible{outline:2px solid var(--mark);outline-offset:-2px}
.n{font-variant-numeric:tabular-nums;color:var(--soft);font-size:13px}
.t{font-weight:700;font-size:17px}
.d{grid-column:2/3;color:var(--soft);font-size:14px;margin-top:-2px;word-break:keep-all}
.go{grid-row:1/3;grid-column:3;align-self:center;color:var(--soft);font-size:14px;white-space:nowrap}
li a:hover .go{color:var(--mark)}
.new{font-family:"Nanum Pen Script",cursive;font-weight:400;color:var(--mark);font-size:20px;margin-left:6px;display:inline-block;transform:rotate(-4deg)}
.memo{margin-top:52px;padding:18px 20px;border:1px solid var(--rule);border-radius:2px;background:var(--hover);font-size:15px;color:var(--soft);word-break:keep-all}
.memo b{color:var(--ink)}
footer{margin:48px 0 40px;font-size:13px;color:var(--soft);display:flex;flex-wrap:wrap;gap:6px 18px}
@media (max-width:520px){header{padding-top:40px}.logo{font-size:38px}.go{display:none}li a{grid-template-columns:24px 1fr}}
</style></head><body>
<div class="w">
<header>
  <a class="logo" href="./"><span id="nm">쓱툴</span><svg viewBox="0 0 100 14" preserveAspectRatio="none" aria-hidden="true"><path d="M2 9 C 25 4, 55 3, 98 7" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg></a>
  <p class="intro">일하다가 <b>"이거 하나만 있으면 좋겠다"</b> 싶을 때마다 하나씩 만든 도구들입니다. 설치도, 가입도 없이 열어서 바로 쓰면 됩니다.</p>
  <span class="note">사진은 내 기기 밖으로 안 나가요</span>
</header>
<main id="list"></main>
<p class="memo"><b>투표·공지·칠판 함께 보기</b>는 참여자가 휴대폰으로 QR만 찍으면 됩니다. 이 내용은 잠깐 서버에 머물다 6시간 뒤 저절로 지워집니다. 그 밖의 사진·문서 도구는 모두 지금 쓰는 기기 안에서만 처리합니다.</p>
<footer><span id="cp"></span><a href="privacy.html">개인정보 안내</a></footer>
</div>
<script>
var G = [
  ['사진 · 개인정보', [
    ['mosaic', '모자이크', '활동사진 속 얼굴·이름표를 흐리게'],
    ['mask', '개인정보 가리개', '신청서·명단의 연락처·주소를 덮어서 (PDF도 됨)'],
    ['bgrm', '배경 지우기', '사람이나 물건만 남기고 배경 없애기'],
    ['resize', '사진 용량 줄이기', '메일·업로드 용량 제한에 맞추기'],
    ['px', '사진 크기 맞추기', '가로·세로 픽셀을 여러 장 한 번에']]],
  ['문서 · 보고', [
    ['sheet', '사진 대지', '활동사진을 보고서용 A4 대지로, 설명까지', 1],
    ['scan', '문서 펴기', '비스듬히 찍은 서류를 스캔한 것처럼'],
    ['qr', 'QR 만들기', '링크를 QR 그림으로']]],
  ['진행 · 참여', [
    ['chalk', '칠판', '판서·안내문 띄우기, 휴대폰으로 함께 보기'],
    ['vote', '실시간 투표', '만족도·의견을 QR로 받아 바로 그래프로', 1],
    ['notice', '다국어 공지', '한국어로 쓰면 참여자 언어로 번역되어 보임', 1],
    ['timer', '타이머', '활동·쉬는 시간을 큰 화면으로']]],
  ['뽑기 · 놀이', [
    ['wheel', '돌림판', '이름이나 항목을 넣고 돌리기'],
    ['ladder', '사다리타기', '역할·순서 정하기'],
    ['lotto', '공 추첨', '경품별 개수를 정해 뽑기']]]
];
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
var k = 0;
document.getElementById('list').innerHTML = G.map(function (g) {
  return '<section><h2>' + esc(g[0]) + '</h2><ol>' + g[1].map(function (t) {
    k++;
    return '<li><a href="tools.html?m=' + t[0] + '"><span class="n">' + (k < 10 ? '0' + k : k) + '</span><span class="t">' + esc(t[1]) + (t[3] ? '<span class="new">new</span>' : '') + '</span><span class="go">열기 →</span><span class="d">' + esc(t[2]) + '</span></a></li>';
  }).join('') + '</ol></section>';
}).join('');
var N = window.SITE_NAME || '쓱툴';
document.getElementById('nm').textContent = N; document.title = N + ' — 현장 업무 도구';
document.getElementById('cp').textContent = '© ' + new Date().getFullYear() + ' ' + N;
</script>
</body></html>
