<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'none'"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>칠판 함께 보기</title>
<meta name="robots" content="noindex">
<script src="../assets/config.js"></script><script src="../assets/gas-shim.js"></script>
<style>
html,body{margin:0;height:100%;background:#111;color:#ddd;font:15px system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#w{position:fixed;top:0;left:0;right:0;bottom:56px;display:flex;align-items:center;justify-content:center}
#im{max-width:100%;max-height:100%;display:none}
#msg{font-size:18px;text-align:center;padding:24px;line-height:1.7}
#st{position:fixed;left:8px;top:6px;font-size:12px;opacity:.65}
#fs{position:fixed;right:8px;top:6px;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:6px;padding:5px 10px;font-size:12px}
#bar{position:fixed;left:0;right:0;bottom:0;min-height:56px;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:8px;background:#1b1b1b;border-top:1px solid #333}
#bar a,#bar button{background:#fff;color:#111;font-weight:700;border:0;border-radius:8px;padding:9px 14px;font-size:14px;text-decoration:none;max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:inherit}
#bar #sv{background:#333;color:#fff}
</style></head><body>
<div id="w"><div id="msg">칠판에 연결하는 중…</div><img id="im" alt="칠판"></div>
<div id="st"></div><button id="fs" type="button">크게 보기</button>
<div id="bar"><span id="lks" style="display:contents"></span><button id="sv" type="button" style="display:none">칠판 그림 저장</button></div>
<script>
var ID = (new URLSearchParams(location.search).get('id') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
var V = -1, STOP = false, busyT = 0, LJ = '';
function $(s) { return document.getElementById(s); }
function msg(t) { $('im').style.display = 'none'; $('msg').style.display = 'block'; $('msg').textContent = t; }
function links(l) {
  var j = JSON.stringify(l || []); if (j === LJ) return; LJ = j; var b = $('lks'); b.textContent = '';
  (l || []).forEach(function (x) { var u = String(x.u || ''); if (!/^https:\/\//.test(u)) return; var a = document.createElement('a'); a.href = u; a.target = '_blank'; a.rel = 'noopener'; a.textContent = String(x.t || '자료'); b.appendChild(a); });
}
function handle(r) {
  r = r || {};
  if (r.end) { STOP = true; msg('선생님이 공유를 끝냈습니다.'); return; }
  if (r.gone) { STOP = true; msg('공유를 찾을 수 없습니다. QR을 다시 찍어 주세요.'); return; }
  if (r.wait) msg('선생님 칠판을 기다리는 중…');
  if (r.img) { $('im').src = r.img; $('im').style.display = 'block'; $('msg').style.display = 'none'; V = r.v; }
  if (r.l) links(r.l);
  if (V >= 0) $('sv').style.display = 'inline-block';
  $('st').textContent = '함께 보기 · ' + ID;
}
function tick() {
  if (STOP || document.hidden) return; if (Date.now() - busyT < 12000) return; busyT = Date.now();
  toolApi('chalkShareGet', [ID, V]).then(function (r) { busyT = 0; handle(r); }, function () { busyT = 0; $('st').textContent = '연결이 잠시 끊겼습니다. 다시 시도 중…'; });
}
$('sv').onclick = function () { var s = $('im').src; if (!s) return; try { var a = document.createElement('a'); a.href = s; a.download = '칠판_' + ID + '.jpg'; document.body.appendChild(a); a.click(); a.remove(); } catch (x) {} $('st').textContent = '저장이 안 되면 칠판 그림을 길게 눌러 저장하세요'; };
$('fs').onclick = function () { var d = document.documentElement; if (d.requestFullscreen) d.requestFullscreen().catch(function () {}); };
if (!ID) msg('주소가 올바르지 않습니다. QR을 다시 찍어 주세요.');
else { setInterval(tick, 2000); tick(); }
</script>
</body></html>
